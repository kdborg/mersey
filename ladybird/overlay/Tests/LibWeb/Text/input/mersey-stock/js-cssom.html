<!doctype html>
<meta charset="utf-8">
<title>lb-stock js cssom</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/cssom.mersey — identical workload.
const name = "cssom";
const N = 10000;
let el = null;
function setup() {
  el = document.createElement("div");
  document.body.appendChild(el);
}
function work(n) {
  let sum = 0;
  for (let i = 0; i < n; i++) {
    el.className = `row mod${i % 7}`;
    if (el.classList.contains("row")) sum += 1;
    el.style.setProperty("margin-left", `${i % 50}px`);
    sum += el.style.getPropertyValue("margin-left").length;
  }
  return sum;
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
