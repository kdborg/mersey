<!doctype html>
<meta charset="utf-8">
<title>lb-stock js query</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/query.mersey — identical workload.
const name = "query";
const N = 2000;
function setup() {
  const ul = document.createElement("ul");
  for (let j = 0; j < 200; j++) {
    const li = document.createElement("li");
    if (j % 2 == 1) {
      li.className = "odd";
    } else {
      li.className = "even";
    }
    li.textContent = `item ${j}`;
    ul.appendChild(li);
  }
  document.body.appendChild(ul);
}
function work(n) {
  let sum = 0;
  for (let i = 0; i < n; i++) {
    const odd = document.querySelectorAll("li.odd");
    sum += odd.length;
    const t = odd[i % 100].textContent;
    if (t != null) sum += t.length;
  }
  return sum;
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
