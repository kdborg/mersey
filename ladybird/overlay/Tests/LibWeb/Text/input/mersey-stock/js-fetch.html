<!doctype html>
<meta charset="utf-8">
<title>lb-stock js fetch</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/fetch.mersey — identical workload.
// Sequential fetch chain via nested .then (not await): Mersey's promises work
// via .then today, so the twins stay line-for-line. work() returns a Promise
// of the checksum; the harness awaits it.
const name = "fetch";
const N = 100;
function work(n) {
  let sum = 0;
  let i = 0;
  return new Promise((resolve) => {
    function step() {
      if (i >= n) {
        resolve(sum);
        return;
      }
      fetch(`http://127.0.0.1:51894/bench/echo?i=${i}`).then((resp) => {
        sum += resp.status;
        resp.text().then((body) => {
          sum += body.length;
          i += 1;
          step();
        });
      });
    }
    step();
  });
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
