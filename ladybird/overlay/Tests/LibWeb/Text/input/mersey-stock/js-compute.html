<!doctype html>
<meta charset="utf-8">
<title>lb-stock js compute</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/compute.mersey. int32 semantics via |0.
const name = "compute";
const N = 2000;
function mix(n, seed) {
  let h = seed | 0;
  for (let i = 0; i < n; i++) {
    h = ((h ^ (h << 13)) + i) | 0;
    h = (h ^ (h >> 7)) | 0;
    h = (Math.imul(h, 31) + 1) | 0;
  }
  return h | 0;
}
function work(rounds) {
  let acc = 0;
  for (let r = 0; r < rounds; r++) acc = (acc ^ mix(20000, r)) | 0;
  return acc | 0;
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
