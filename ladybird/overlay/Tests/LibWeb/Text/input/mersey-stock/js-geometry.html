<!doctype html>
<meta charset="utf-8">
<title>lb-stock js geometry</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/geometry.mersey — identical workload.
// A DOMMatrix per iteration, translate + scale chained, three components
// read back; everything stays integral so the checksum is exact.
const name = "geometry";
const N = 10000;
function work(n) {
  let sum = 0;
  let i = 0;
  while (i < n) {
    const m = new DOMMatrix();
    const t = m.translate(i % 10, 3.0).scale(2.0);
    sum = sum + t.m41 + t.m42 + t.a;
    i += 1;
  }
  return sum;
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
