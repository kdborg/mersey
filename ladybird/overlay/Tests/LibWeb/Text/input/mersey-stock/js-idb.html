<!doctype html>
<meta charset="utf-8">
<title>lb-stock js idb</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/idb.mersey — identical workload.
// A put + get roundtrip in a fresh readwrite transaction per iteration,
// chained through the request success events.
const name = "idb";
const N = 500;
function work(n) {
  let sum = 0;
  let i = 0;
  return new Promise((resolve) => {
    function step(db) {
      if (i >= n) {
        resolve(sum);
        db.close();
        return;
      }
      const tx = db.transaction("kv", "readwrite");
      const store = tx.objectStore("kv");
      store.put(`value-${i}`, "k");
      const g = store.get("k");
      g.addEventListener("success", () => {
        sum = sum + g.result.length;
        i += 1;
        step(db);
      });
    }
    const open = indexedDB.open("mersey-bench", 1);
    open.addEventListener("upgradeneeded", () => {
      const db = open.result;
      db.createObjectStore("kv");
    });
    open.addEventListener("success", () => {
      const db = open.result;
      step(db);
    });
  });
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
