<!doctype html>
<meta charset="utf-8">
<title>lb-stock js blob</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/blob.mersey — identical workload.
// A two-part Blob per iteration, size read plus a slice's size.
const name = "blob";
const N = 10000;
function work(n) {
  let sum = 0;
  let i = 0;
  while (i < n) {
    const b = new Blob([`part-${i}`, "-suffix"]);
    sum = sum + b.size + b.slice(0, 4).size;
    i += 1;
  }
  return sum;
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
