<!doctype html>
<meta charset="utf-8">
<title>lb-stock js dom</title>
<body><div id="out"></div>
<script src="../include.js"></script>
<script>
// Plain-JS counterpart of mersey/dom.mersey — identical workload.
const name = "dom";
const N = 10000;
function work(n) {
  const body = document.body;
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.textContent = `item ${i}`;
    body.appendChild(el);
  }
  return n;
}

asyncTest(async (done) => {
  try {
    if (typeof setup === "function") setup();
    await work(Math.min(1000, N)); // warm up
    const t0 = performance.now();
    const checksum = await work(N);
    const t1 = performance.now();
    println("RESULT " + name + " " + (t1 - t0) + " " + checksum);
  } catch (e) { println("ERROR " + (e && e.message)); }
  done();
});
</script>
</body>
