<!DOCTYPE html>
<meta charset="utf-8">
<title>Mersey in Chromium</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 3rem auto; max-width: 40rem; }
  h1 { font-size: 1.4rem; }
  #out { font-size: 2rem; font-weight: 600; margin: 1rem 0; }
  button { font: inherit; padding: .4rem 1rem; }
  .note { color: #666; font-size: .9rem; }
</style>

<h1>This page has no JavaScript in it.</h1>
<p class="note">
  The script below is <code>type="text/mersey"</code> — a statically typed,
  class-based language. Chromium hands it to the Mersey engine, which
  type-checks it, lowers it to bytecode, and runs it. V8 is not in this stack.
</p>

<div id="out">…</div>
<button id="btn">Click me</button>

<script type="text/mersey">
import { console } from "std:console";
import { document } from "browser:dom";
import { Element } from "browser:dom";

class Counter {
    private count: int32 = 0;          // no initializer needed: zero-defaults

    public bump(): void {
        this.count = this.count + 1;
    }

    public render(): string {
        if (this.count == 0) {
            return "Clicks: 0";
        }
        if (this.count >= 5) {
            return `Clicks: ${this.count} 🌊`;
        }
        return `Clicks: ${this.count}`;
    }
}

const counter = new Counter();
const out = document.getElementById("out") as Element;
const btn = document.getElementById("btn") as Element;

out.textContent = counter.render();

btn.addEventListener("click", () => {
    counter.bump();
    out.textContent = counter.render();
});

console.log("Mersey is running inside Chromium 🌊");
</script>
