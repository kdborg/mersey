<!DOCTYPE html>
<!-- Self-contained TODO demo for the MERSEY-NATIVE Chromium fork. Unlike the
     polyfill pages in the engine repo this uses NO WASM loader and NO external
     src: the whole program is an INLINE <script type="text/mersey">, the only
     form the fork executes. Open it in the fork's built shell, e.g.
         out/mersey-arm64/content_shell third_party/mersey/demos/todo.html
     or the built Chromium.app. The list, element creation and click-to-remove
     are all driven by the Mersey engine; no hand-written JavaScript. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mersey — TODO (native)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; }
    li { cursor: pointer; margin: .3rem 0; }
    input, button { font-size: 1rem; padding: .4rem; }
  </style>
</head>
<body>
  <h1>Mersey TODO, native</h1>
  <p id="count">…</p>
  <input id="new-todo" placeholder="what needs doing?">
  <button id="add">Add</button>
  <ul id="list"></ul>

  <script type="text/mersey">
// TODO app (ROADMAP Phase 5 demo): list manipulation, element creation,
// events — zero hand-written JavaScript beyond the loader.
import { console } from "std:console";
import { document } from "browser:dom";

class TodoList {
    private items: Map<string, Element> = new Map<string, Element>();
    private nextId: int32 = 1;
    private readonly container: Element;
    private readonly counter: Element;

    public constructor(container: Element, counter: Element) {
        this.container = container;
        this.counter = counter;
        this.render();
    }

    public addItem(text: string): void {
        if (text.length == 0) { return; }
        const key = `todo-${this.nextId}`;
        this.nextId += 1;
        const li = document.createElement("li");
        li.textContent = text + "  (click to remove)";
        const items = this.items;
        const self = this;
        li.addEventListener("click", () => {
            li.remove();
            items.remove(key);
            self.render();
        });
        this.items.set(key, li);
        this.container.appendChild(li);
        this.render();
    }

    public render(): void {
        const n = this.items.size;
        this.counter.textContent = n == 0
            ? "nothing to do 🌊"
            : `${n} item${n == 1 ? "" : "s"} to do`;
    }
}

const list = new TodoList(
    document.getElementById("list") as Element,
    document.getElementById("count") as Element,
);
const input = document.getElementById("new-todo") as HTMLInputElement;
const add = document.getElementById("add") as Element;

add.addEventListener("click", () => {
    list.addItem(input.value);
    input.value = "";
});

console.log("todo app ready");
  </script>
</body>
</html>
