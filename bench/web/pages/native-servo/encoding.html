<!doctype html>
<meta charset="utf-8">
<title>native-servo encoding</title>
<body><div id="out"></div>
<script type="text/mersey">
// Web-platform workload: text encoding. UTF-8 encode + decode roundtrip each
// iteration — a string crosses the bridge out, a typed array crosses back,
// and the reverse. The payload includes a non-ASCII char so both transcoders
// do real work.
import { console } from "std:console";
import { time } from "std:time";
import { TextEncoder, TextDecoder } from "browser:dom";

const N: int32 = 10000;
const enc = new TextEncoder();
const dec = new TextDecoder();

function work(n: int32): int32 {
    let sum = 0;
    let i = 0;
    while (i < n) {
        const bytes = enc.encode(`payload ${i} — encdec`);
        sum = sum + bytes.length;
        const str = dec.decode(bytes);
        sum = sum + str.length;
        i += 1;
    }
    return sum;
}

work(1000);
const t0 = time.monotonic();
const c = work(N);
const t1 = time.monotonic();
console.log(`RESULT encoding ${t1 - t0} ${c}`);

</script>
</body>
