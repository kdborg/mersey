<!doctype html>
<meta charset="utf-8">
<title>native-servo urlpattern</title>
<body><div id="out"></div>
<script type="text/mersey">
// Web-platform workload: URL Pattern. One compiled pattern; each iteration
// is a test() and an exec() against a fresh URL string, with the matched
// component's input read back — the pattern-matching engine, not parsing.
import { console } from "std:console";
import { time } from "std:time";
import { URLPattern } from "browser:dom";

const N: int32 = 5000;

const p = new URLPattern("/users/:id/*", "https://example.com");

function work(n: int32): int32 {
    let sum = 0;
    let i = 0;
    while (i < n) {
        const u = `https://example.com/users/${i}/posts`;
        if (p.test(u)) {
            sum += 1;
        }
        const r = p.exec(u);
        sum = sum + (((r as URLPatternResult).pathname as URLPatternComponentResult).input as string).length;
        i += 1;
    }
    return sum;
}

work(1000);
const t0 = time.monotonic();
const c = work(N);
const t1 = time.monotonic();
console.log(`RESULT urlpattern ${t1 - t0} ${c}`);

</script>
</body>
