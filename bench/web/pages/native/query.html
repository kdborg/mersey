<!doctype html>
<meta charset="utf-8">
<title>native query</title>
<body><div id="out"></div>
<script type="text/mersey">
// Web-platform workload: selector queries. Each iteration runs a real
// selector match over a 200-node list (querySelectorAll), then reads the
// length and one element's text back through the live NodeList.
import { console } from "std:console";
import { time } from "std:time";
import { document, Element, HTMLElement } from "browser:dom";

const N: int32 = 2000;

const ul = document.createElement("ul") as HTMLElement;
let j = 0;
while (j < 200) {
    const li = document.createElement("li") as HTMLElement;
    if (j % 2 == 1) {
        li.className = "odd";
    } else {
        li.className = "even";
    }
    li.textContent = `item ${j}`;
    ul.appendChild(li);
    j += 1;
}
(document.body as Element).appendChild(ul);

function work(n: int32): int32 {
    let sum = 0;
    let i = 0;
    while (i < n) {
        const odd = document.querySelectorAll("li.odd");
        sum = sum + odd.length;
        const t = (odd[i % 100] as Element).textContent;
        if (t != null) {
            sum = sum + t.length;
        }
        i += 1;
    }
    return sum;
}

work(200);
const t0 = time.monotonic();
const c = work(N);
const t1 = time.monotonic();
console.log(`RESULT query ${t1 - t0} ${c}`);

</script>
</body>
