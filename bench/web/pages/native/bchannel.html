<!doctype html>
<meta charset="utf-8">
<title>native bchannel</title>
<body><div id="out"></div>
<script type="text/mersey">
// Web-platform workload: Broadcast Channel. A sender and a receiver channel
// on the same name; each iteration is a postMessage delivered as a real
// message event task on the other channel, re-entering the engine.
import { console } from "std:console";
import { time } from "std:time";
import { BroadcastChannel } from "browser:dom";

const N: int32 = 1000;

let sum = 0;
let i = 0;

const t0 = time.monotonic();
const tx = new BroadcastChannel("mersey-bench");
const rx = new BroadcastChannel("mersey-bench");
rx.addEventListener("message", (ev: Event) => {
    const data = (ev as MessageEvent).data as string;
    sum = sum + data.length;
    i += 1;
    if (i >= N) {
        const t1 = time.monotonic();
        console.log(`RESULT bchannel ${t1 - t0} ${sum}`);
        tx.close();
        rx.close();
        return;
    }
    tx.postMessage(`bc-${i}`);
});
tx.postMessage(`bc-${i}`);

</script>
</body>
