<!doctype html>
<meta charset="utf-8">
<title>native canvas</title>
<body><div id="out"></div>
<script type="text/mersey">
// Web-platform workload: Canvas 2D. A fillRect each iteration — a bridge call
// on a long-lived rendering-context handle.
import { console } from "std:console";
import { time } from "std:time";
import { document } from "browser:dom";

const N: int32 = 20000;
const canvas = document.createElement("canvas") as HTMLCanvasElement;
canvas.width = 200;
canvas.height = 200;
const ctx = canvas.getContext("2d") as CanvasRenderingContext2D;

function work(n: int32): int32 {
    let i = 0;
    while (i < n) {
        ctx.fillRect((i % 100) as float64, 0.0, 10.0, 10.0);
        i += 1;
    }
    return n;
}

work(1000);
const t0 = time.monotonic();
const c = work(N);
const t1 = time.monotonic();
console.log(`RESULT canvas ${t1 - t0} ${c}`);

</script>
</body>
