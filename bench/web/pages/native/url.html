<!doctype html>
<meta charset="utf-8">
<title>native url</title>
<body><div id="out"></div>
<script type="text/mersey">
// Web-platform workload: URL parsing. Each iteration constructs a URL object
// (a bridge `new`) and reads two parsed components back (two bridge gets).
import { console } from "std:console";
import { time } from "std:time";
import { URL } from "browser:dom";

const N: int32 = 20000;

function work(n: int32): int32 {
    let sum = 0;
    let i = 0;
    while (i < n) {
        const u = new URL(`https://example.com/path/${i}?q=mersey&n=${i}`);
        sum = sum + u.pathname.length + u.search.length;
        i += 1;
    }
    return sum;
}

work(1000);
const t0 = time.monotonic();
const c = work(N);
const t1 = time.monotonic();
console.log(`RESULT url ${t1 - t0} ${c}`);

</script>
</body>
