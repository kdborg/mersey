name: build

# Phase 3a — validate the cross-platform build (scripts/build.sh) on real
# Linux / macOS / Windows runners, x64 and arm64, and capture per-platform
# engine perf. The
# portable core (engine, CLI, staticlib, wasm) is native cargo, so this proves
# the Phase 2 cross-platform claim. Browser-fork builds are phase 3b (heavy,
# self-hosted).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest,     name: macos-arm64 }
          - { os: windows-latest,   name: windows-x64 }
          - { os: windows-11-arm,   name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The whole point: one script, every platform.
      - name: build engine + CLI + staticlib
        shell: bash
        run: scripts/build.sh engine

      - name: build wasm engine
        shell: bash
        run: scripts/build.sh wasm

      # mersey_wasm is a wasm32 cdylib importing host hooks; it cannot link on a
      # native test target (except Linux, which tolerates undefined symbols), so
      # it is excluded here and covered by the wasm build above / the web tests.
      - name: test
        run: cargo test --workspace --exclude mersey_wasm

      # Native C-ABI embedding (Stage B): compile native/host_demo.c against the
      # staticlib and run it — exercises the full msy_context_* / web_* boundary
      # end to end, including the batched web_apply path (ABI v10). It is POSIX C
      # (memmem, -ldl), so it runs on Linux + macOS, not Windows.
      - name: native C-ABI host + web_apply
        if: runner.os != 'Windows'
        shell: bash
        run: ./native/build-and-test.sh

      # Per-platform engine perf: the CLI-safe compute kernels self-time and
      # print `RESULT <wl> <ms> <checksum>`. Portable (no OS-specific timer).
      # This is the NATIVE engine — the compiled `target/release/mersey` binary
      # running the Cranelift Tier-1 JIT (on by default; MERSEY_JIT=0 would fall
      # back to the bytecode VM, ~60-100x slower). It is not wasm: the wasm
      # engine is a separate leg gated by bench/web/perf-test.mjs against
      # perf-baselines.json, not measured here.
      - name: engine perf stats (native, JIT tier-1)
        shell: bash
        run: |
          out="perf-${{ matrix.name }}.txt"
          { echo "platform: ${{ matrix.name }} (native cdylib, Cranelift Tier-1 JIT)"
            rustc --version; } > "$out"
          for wl in compute calls fcompute mathk; do
            MERSEY_JIT=1 ./target/release/mersey run "bench/web/mersey/$wl.mersey" | tee -a "$out"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.name }}
          path: perf-${{ matrix.name }}.txt
