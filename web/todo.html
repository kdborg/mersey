<!DOCTYPE html>
<html lang="en">
<head>

  <title>Mersey — TODO demo</title>

    li { cursor: pointer; margin: .3rem 0; }
    input, button { font-size: 1rem; padding: .4rem; }
  </style>
  <script src="mersey-loader.js" data-engine="mersey_wasm.wasm" defer></script>

</html>
