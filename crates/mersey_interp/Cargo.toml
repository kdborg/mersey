[package]
name = "mersey_interp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mersey MVP tree-walking interpreter (the bytecode VM replaces this in Phase 2)"

[dependencies]
mersey_front = { path = "../mersey_front" }
# On-demand native-stack growth for the tree-walker, whose Mersey calls recurse
# on the Rust stack (the VM/JIT loop instead). Without it the reference tier hits
# a fixed stack budget dozens of frames in, while the VM reaches MAX_CALL_DEPTH —
# so the tiers disagreed on deep recursion. `maybe_grow` lets the tree-walker
# reach the same depth limit. No-ops on targets that cannot grow the stack.
stacker = "0.1"
# WHATWG URL parsing for `parse.url` (std:url's engine half). The one place the
# engine takes a parser it did not write: URL syntax is a living standard with
# IDNA and percent-encoding rules, and matching a browser's `new URL` by hand is
# a maintenance bill, not a feature. Same crate Servo and Firefox use.
url = "2"
# FxHash for the engine's internal maps — see the `HashMap` alias in lib.rs for
# why SipHash's collision resistance buys nothing here. Pure Rust, no_std, so it
# costs the wasm build essentially nothing.
rustc-hash = "2"

[lints]
workspace = true
